<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Проверка мобильного калькулятора</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#e8eae5;color:#26342f;font-family:system-ui,sans-serif}
  header{display:flex;justify-content:center;align-items:center;gap:16px;flex-wrap:wrap;padding:12px;font-size:14px}
  select{font:inherit;padding:8px;border:1px solid #bbc9c3;border-radius:8px;background:white}
  main{display:flex;justify-content:center;padding:0 8px 12px}
  iframe{display:block;width:390px;max-width:100%;height:844px;border:1px solid #ccc;border-radius:16px;background:#fbf3e7;box-shadow:0 8px 30px #0002}
</style>
<header><label>Ширина экрана <select id="width"><option>320</option><option>360</option><option selected>390</option><option>430</option><option>768</option></select> px</label><span>Проверка мобильного вида</span></header>
<main><iframe title="Калькулятор на мобильном экране" src="index.html"></iframe></main>
<script>document.querySelector('iframe').src='index.html'+location.search;document.querySelector('#width').onchange=e=>document.querySelector('iframe').style.width=e.target.value+'px';</script>
</html>
